services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - APP_ORIGIN=${APP_ORIGIN:-https://localhost}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-604800}
      - TRUSTED_PROXY_IP=${TRUSTED_PROXY_IP:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "5173"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
