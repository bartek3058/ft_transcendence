services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the project .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the project .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in the project .env file}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the project .env file}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/prisma/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Generating Prisma client..."
        npx prisma generate
        echo "Applying migrations with owner role..."
        npx prisma migrate deploy
        echo "Running database seed..."
        npx prisma db seed
    environment:
      - DATABASE_URL=${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in the project .env file}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - APP_ORIGIN=${APP_ORIGIN:-https://localhost}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-604800}
      - TRUSTED_PROXY_IP=${TRUSTED_PROXY_IP:-}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the project .env file}
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "5173"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
